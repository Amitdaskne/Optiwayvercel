<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customers Directory - OPTIWAY</title>
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body class="bg-slate-50 min-h-screen flex flex-col antialiased">
    <div class="flex flex-1 min-h-screen">
      <!-- Sidebar -->
      <div id="app-sidebar"></div>

      <!-- Main Content -->
      <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
        <!-- Header -->
        <div id="app-header"></div>

        <main class="flex-1 overflow-y-auto p-4 sm:p-6 md:p-8 space-y-6">
          <div class="flex flex-wrap items-center justify-between gap-4 bg-white p-4 rounded-xl border border-slate-200 shadow-2xs">
            <div>
              <h2 class="text-base font-bold text-slate-900">Customer Records & Patient Directory</h2>
              <p class="text-xs text-slate-500">Manage client contact records, purchase histories, and outstanding balances</p>
            </div>
            <button id="btn-open-add-cust" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-lg shadow-2xs transition-colors">
              + Add New Customer
            </button>
          </div>

          <!-- Search Bar -->
          <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-2xs">
            <input type="text" id="cust-search" placeholder="Search by customer name, mobile number, or email..." class="w-full px-4 py-2.5 text-xs border border-slate-300 rounded-lg outline-none" />
          </div>

          <!-- Customers Table -->
          <div class="bg-white rounded-xl border border-slate-200 shadow-2xs overflow-hidden">
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse text-xs">
                <thead>
                  <tr class="bg-slate-50 text-slate-600 font-bold uppercase text-[11px] border-b border-slate-200">
                    <th class="p-3.5">Customer Name</th>
                    <th class="p-3.5">Mobile Number</th>
                    <th class="p-3.5">Email</th>
                    <th class="p-3.5">Address</th>
                    <th class="p-3.5">Outstanding</th>
                    <th class="p-3.5">Last Purchase</th>
                    <th class="p-3.5 text-right">Actions</th>
                  </tr>
                </thead>
                <tbody id="tbl-customers-body" class="divide-y divide-slate-100 text-slate-700">
                  <tr><td colspan="7" class="p-8 text-center text-slate-400">Loading customer directory...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </main>
      </div>
    </div>

    <!-- Add/Edit Customer Modal -->
    <div id="modal-cust" class="fixed inset-0 bg-slate-900/80 z-50 flex items-center justify-center p-4 hidden">
      <div class="bg-white rounded-2xl max-w-md w-full p-6 space-y-4 border border-slate-200 shadow-2xl">
        <div class="flex justify-between items-center border-b border-slate-100 pb-3">
          <h3 id="modal-cust-title" class="font-bold text-slate-900 text-sm">Add New Customer</h3>
          <button id="btn-close-cust-modal" class="text-slate-400 hover:text-slate-700">✕</button>
        </div>

        <form id="form-cust" class="space-y-3">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Customer Full Name *</label>
            <input type="text" id="cust-field-name" required placeholder="e.g. John Smith" class="w-full px-3 py-2 text-xs border border-slate-300 rounded-lg outline-none" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Mobile Phone Number *</label>
            <input type="text" id="cust-field-mobile" required placeholder="+1 555-019-2834" class="w-full px-3 py-2 text-xs border border-slate-300 rounded-lg outline-none" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Email Address</label>
            <input type="email" id="cust-field-email" placeholder="john@example.com" class="w-full px-3 py-2 text-xs border border-slate-300 rounded-lg outline-none" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Street Address</label>
            <input type="text" id="cust-field-address" placeholder="123 Vision Way, New York, NY" class="w-full px-3 py-2 text-xs border border-slate-300 rounded-lg outline-none" />
          </div>

          <div class="flex justify-end gap-2 pt-3 border-t border-slate-100">
            <button type="button" id="btn-cancel-cust-modal" class="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-lg">Cancel</button>
            <button type="submit" class="px-4 py-2 bg-blue-600 text-white font-bold text-xs rounded-lg hover:bg-blue-700">Save Customer</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Customer History Modal -->
    <div id="modal-cust-history" class="fixed inset-0 bg-slate-900/80 z-50 flex items-center justify-center p-4 hidden">
      <div class="bg-white rounded-2xl max-w-2xl w-full p-6 space-y-4 border border-slate-200 shadow-2xl max-h-[90vh] overflow-y-auto">
        <div class="flex justify-between items-center border-b border-slate-100 pb-3">
          <div>
            <h3 id="hist-cust-name" class="font-bold text-slate-900 text-base">Customer History</h3>
            <p id="hist-cust-info" class="text-xs text-slate-500"></p>
          </div>
          <button id="btn-close-hist-modal" class="text-slate-400 hover:text-slate-700">✕</button>
        </div>

        <div id="hist-modal-content" class="space-y-4 text-xs">
          <!-- Dynamically populated purchase & rx history -->
        </div>
      </div>
    </div>

    <script type="module" src="/src/pages/customers.ts"></script>
  </body>
</html>
