<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker - OPTIWAY</title>
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body class="bg-slate-50 min-h-screen flex flex-col antialiased">
    <div class="flex flex-1 min-h-screen">
      <!-- Sidebar -->
      <div id="app-sidebar"></div>

      <!-- Main Content -->
      <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
        <!-- Header -->
        <div id="app-header"></div>

        <main class="flex-1 overflow-y-auto p-4 sm:p-6 md:p-8 space-y-6">
          <div class="flex flex-wrap items-center justify-between gap-4 bg-white p-4 rounded-xl border border-slate-200 shadow-2xs">
            <div>
              <h2 class="text-base font-bold text-slate-900">Store Operating Expense Tracker</h2>
              <p class="text-xs text-slate-500">Record utilities, rent, lab machinery maintenance, and store overheads</p>
            </div>
            <button id="btn-open-add-exp" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-lg shadow-2xs transition-colors">
              + Record Expense
            </button>
          </div>

          <!-- Total Expenses Summary Card -->
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-2xs">
              <p class="text-xs font-semibold text-slate-500">Total Recorded Expenses</p>
              <h3 id="exp-total-amount" class="text-xl font-black text-rose-600 mt-1">$0.00</h3>
            </div>
          </div>

          <!-- Filters Bar -->
          <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-2xs grid grid-cols-1 sm:grid-cols-3 gap-3">
            <div class="sm:col-span-2">
              <input type="text" id="exp-search" placeholder="Search expense description, category..." class="w-full px-4 py-2 text-xs border border-slate-300 rounded-lg outline-none" />
            </div>
            <div>
              <select id="exp-cat-filter" class="w-full px-3 py-2 text-xs border border-slate-300 rounded-lg outline-none bg-white">
                <option value="All">All Categories</option>
                <option value="Rent">Store Rent</option>
                <option value="Utilities">Utilities & Power</option>
                <option value="Lab Equipment">Lab Equipment / Tools</option>
                <option value="Salaries">Staff Salaries</option>
                <option value="Marketing">Marketing & Ads</option>
                <option value="Other">Other Expenses</option>
              </select>
            </div>
          </div>

          <!-- Expenses Table -->
          <div class="bg-white rounded-xl border border-slate-200 shadow-2xs overflow-hidden">
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse text-xs">
                <thead>
                  <tr class="bg-slate-50 text-slate-600 font-bold uppercase text-[11px] border-b border-slate-200">
                    <th class="p-3.5">Expense Date</th>
                    <th class="p-3.5">Category</th>
                    <th class="p-3.5">Description</th>
                    <th class="p-3.5">Payment Method</th>
                    <th class="p-3.5">Amount</th>
                    <th class="p-3.5 text-right">Actions</th>
                  </tr>
                </thead>
                <tbody id="tbl-expenses-body" class="divide-y divide-slate-100 text-slate-700">
                  <tr><td colspan="6" class="p-8 text-center text-slate-400">Loading expenses...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </main>
      </div>
    </div>

    <!-- Add Expense Modal -->
    <div id="modal-exp" class="fixed inset-0 bg-slate-900/80 z-50 flex items-center justify-center p-4 hidden">
      <div class="bg-white rounded-2xl max-w-md w-full p-6 space-y-4 border border-slate-200 shadow-2xl">
        <div class="flex justify-between items-center border-b border-slate-100 pb-3">
          <h3 class="font-bold text-slate-900 text-sm">Record Store Expense</h3>
          <button id="btn-close-exp-modal" class="text-slate-400 hover:text-slate-700">✕</button>
        </div>

        <form id="form-exp" class="space-y-3">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Expense Category *</label>
            <select id="exp-category" required class="w-full px-3 py-2 text-xs border border-slate-300 rounded-lg outline-none bg-white font-semibold">
              <option value="Rent">Store Rent</option>
              <option value="Utilities">Utilities & Power</option>
              <option value="Lab Equipment">Lab Equipment / Maintenance</option>
              <option value="Salaries">Staff Salaries</option>
              <option value="Marketing">Marketing & Advertising</option>
              <option value="Other">Other Expenses</option>
            </select>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Amount ($) *</label>
              <input type="number" step="0.01" min="0" id="exp-amount" required placeholder="150.00" class="w-full px-3 py-2 text-xs border border-slate-300 rounded-lg outline-none font-bold text-slate-900" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Date *</label>
              <input type="date" id="exp-date" required class="w-full px-3 py-2 text-xs border border-slate-300 rounded-lg outline-none bg-white font-semibold" />
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Payment Method</label>
            <select id="exp-payment-method" class="w-full px-3 py-2 text-xs border border-slate-300 rounded-lg outline-none bg-white">
              <option value="Cash">Cash</option>
              <option value="UPI">UPI</option>
              <option value="Card">Bank Card / Transfer</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Description / Notes *</label>
            <input type="text" id="exp-description" required placeholder="e.g. Monthly lens edger machine servicing fee" class="w-full px-3 py-2 text-xs border border-slate-300 rounded-lg outline-none" />
          </div>

          <div class="flex justify-end gap-2 pt-3 border-t border-slate-100">
            <button type="button" id="btn-cancel-exp-modal" class="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-lg">Cancel</button>
            <button type="submit" class="px-4 py-2 bg-blue-600 text-white font-bold text-xs rounded-lg hover:bg-blue-700">Save Expense</button>
          </div>
        </form>
      </div>
    </div>

    <script type="module" src="/src/pages/expenses.ts"></script>
  </body>
</html>
